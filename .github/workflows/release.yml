name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v20260301)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # Build AppImage
  appimage-build:
    name: Bundle pdenv into AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Validate release tag
        run: |
          [[ "$RELEASE_TAG" == v* ]] || {
            echo "::error::Release tag must start with v"
            exit 1
          }
          git check-ref-format "refs/tags/$RELEASE_TAG"

      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Use Cachix
        uses: cachix/cachix-action@v17
        with:
          name: hurricanehrndz
          skipPush: true
          useDaemon: false

      - name: Build AppImage
        run: |
          nix bundle --bundler github:ralismark/nix-appimage .\#pdenv

      - name: Upload AppImage
        uses: actions/upload-artifact@v6
        with:
          name: pdenv-appimage
          path: "*.AppImage"
          overwrite: true

  # Create GitHub release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: appimage-build

    steps:
      - name: Download AppImage
        uses: actions/download-artifact@v7
        with:
          name: pdenv-appimage
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ env.RELEASE_TAG }}
          body: |
            # pdenv ${{ env.RELEASE_TAG }}

            Personal development environment with Neovim.

            ## Installation

            Download the AppImage and make it executable:

            ```bash
            chmod +x pdenv-*.AppImage
            ./pdenv-*.AppImage
            ```

            Or use Nix:

            ```bash
            nix run github:hurricanehrndz/pdenv/${{ env.RELEASE_TAG }}
            ```

            ## Documentation

            See [README.md](https://github.com/${{ github.repository }}/blob/${{ env.RELEASE_TAG }}/README.md) for usage instructions.
          files: ./artifacts/*.AppImage
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}

permissions:
  contents: write
  packages: write
